# Site Configuration
baseURL = "https://blog.radapp.io"
languageCode = "en-us"
title = "Radius Blog"

# Hugo Modules: pull Docsy from upstream instead of vendoring under themes/.
[module]
proxy = "direct"
[module.hugoVersion]
extended = true
min = "0.157.0"
[[module.imports]]
path = "github.com/google/docsy"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "archetypes"
target = "archetypes"

# Configure how URLs look like per section.
[permalinks]
posts = "/:section/:year/:month/:day/:slug/"

# Google Analytics
[services.googleAnalytics]
id = "G-SZ71KL0YSK"

enableGitInfo = true
disableFastRender = true

# Allow embedded HTML in pages
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Top Nav Bar
[[menu.main]]
    name = "Home"
    weight = 10
    url = "https://radapp.io/"
    pre = "<i class='fas fa-home'></i>"
[[menu.main]]
    name = "Docs"
    weight = 30
    url = "https://docs.radapp.io/"
    pre = "<i class='fas fa-file'></i>"
[[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/radius-project"
    pre = "<i class='fab fa-github'></i>"
[[menu.main]]
    name = "Discord"
    weight = 90
    url = "https://aka.ms/Radius/Discord"
    pre = "<i class='fab fa-discord'></i>"

# UI Customization
[params.ui]
# navbar_logo = true
sidebar_menu_compact = true
sidebar_search_disable = true
ul_show = 1
navbar_logo = true

copyright = "Radius"

# GitHub Information
github_repo = "https://github.com/radius-project/blog"
github_subdir = "blog"
github_branch = "main"
github_project_repo = "https://github.com/radius-project/radius"
