# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Deploy Blog Website

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  schedule:
    - cron: 0 16 * * *

permissions: {}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build and Deploy Job for Static Web App
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GOVER: "1.25"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Go ${{ env.GOVER }}
        id: setup-go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ env.GOVER }}

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: 0.102.3
          extended: true

      - name: Setup Docsy
        run: |
          cd radblog
          sudo npm install -D --save autoprefixer
          sudo npm install -D --save postcss-cli
          cd themes/docsy
          npm install

      - name: Restore Go Modules Cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        if: steps.setup-go.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('radius/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build And Deploy Staging Site
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        id: builddeploystaging
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        env:
          HUGO_ENV: production
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          skip_deploy_on_missing_secrets: true
          repo_token: ${{ github.token }} # Used for Github integrations (i.e. PR comments)
          action: upload
          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: radblog # App source code path
          api_location: api # Api source code path - optional
          app_artifact_location: public # Built app content directory - optional
          app_build_command: hugo --buildFuture
          ###### End of Repository/Build Configurations ######

      - name: Build And Deploy Live Site
        if: github.event_name == 'push'
        id: builddeploylive
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        env:
          HUGO_ENV: production
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          skip_deploy_on_missing_secrets: true
          repo_token: ${{ github.token }} # Used for Github integrations (i.e. PR comments)
          action: upload
          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: radblog # App source code path
          api_location: api # Api source code path - optional
          app_artifact_location: public # Built app content directory - optional
          app_build_command: hugo
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    name: Close Pull Request Job
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          skip_deploy_on_missing_secrets: true
          action: close
          app_location: radblog
