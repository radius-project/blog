name: Spellcheck

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'radblog/**'
      - '.github/workflows/spellcheck.yaml'
      - '.github/config/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'radblog/**'
      - '.github/workflows/spellcheck.yaml'
      - '.github/config/**'

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout blog
      uses: actions/checkout@master
    - name: Spellcheck
      uses: rojopolis/spellcheck-github-actions@0.33.0
      with:
        config_path: .github/config/.pyspelling.yml
