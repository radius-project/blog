name: Radius Release Webhook Handler

# This workflow handles webhooks from the main Radius repository
# when a new release is published, automatically triggering blog post generation

on:
  repository_dispatch:
    types: [radius-release-published]

jobs:
  handle-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate payload
        id: validate
        run: |
          TAG_NAME="${{ github.event.client_payload.tag_name }}"
          REPOSITORY="${{ github.event.client_payload.repository }}"
          
          echo "Received release notification:"
          echo "  Tag: $TAG_NAME"
          echo "  Repository: $REPOSITORY"
          echo "  Triggered at: ${{ github.event.client_payload.triggered_at }}"
          
          if [ -z "$TAG_NAME" ]; then
            echo "❌ Error: tag_name is required in client_payload"
            exit 1
          fi
          
          if [ "$REPOSITORY" != "radius-project/radius" ]; then
            echo "⚠️  Warning: Expected repository 'radius-project/radius', got '$REPOSITORY'"
          fi
          
          echo "✅ Payload validation passed"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Trigger blog post workflow
        uses: actions/github-script@v7
        with:
          script: |
            const tag_name = '${{ steps.validate.outputs.tag_name }}';
            
            console.log(`Triggering auto-blog-post workflow for tag: ${tag_name}`);
            
            try {
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-blog-post.yml',
                ref: 'main',
                inputs: {
                  tag_name: tag_name
                }
              });
              
              console.log('✅ Successfully triggered blog post workflow');
              console.log(`Check workflow progress at: https://github.com/${context.repo.owner}/${context.repo.repo}/actions`);
            } catch (error) {
              console.error('❌ Failed to trigger blog post workflow:', error.message);
              process.exit(1);
            }

      - name: Log completion
        run: |
          echo "🎉 Release webhook processing completed!"
          echo ""
          echo "Summary:"
          echo "  Release tag: ${{ steps.validate.outputs.tag_name }}"
          echo "  Blog post workflow: Triggered"
          echo "  Next steps: The auto-blog-post workflow will generate a blog post and create a PR"