name: Auto-generate Blog Post for New Radius Release

on:
  repository_dispatch:
    types: [radius-release-published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (optional - will use latest if not provided)'
        required: false
        type: string
  push:
    branches:
      - 'autogen'

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate blog post and create PR
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name || '' }}
        run: |
          echo "Using release tag: ${RELEASE_TAG:-'latest'}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

          # Generate AI content (will use latest if tag is empty)
          if ./scripts/generate-ai-content.sh "$RELEASE_TAG" "${{ secrets.GITHUB_TOKEN }}"; then
            echo "AI_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "AI_SUCCESS=false" >> $GITHUB_ENV
          fi

          # Create blog post (will use latest if tag is empty)
          ./scripts/create-blog-post.sh "$RELEASE_TAG" "ai_content.md"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_RAD_CI_BOT_PAT }}
          commit-message: "Add blog post for Radius ${{ env.RELEASE_TAG }}"
          signoff: true
          title: "Add blog post for Radius ${{ env.RELEASE_TAG }}"
          body: |
            Auto-generated blog post for **Radius ${{ env.RELEASE_TAG }}**

            - **Tag:** ${{ env.RELEASE_TAG }}
            - **Release:** https://github.com/radius-project/radius/releases/tag/${{ env.RELEASE_TAG }}
            - **AI Generated:** ${{ env.AI_SUCCESS == 'true' && '✅ Yes' || '❌ No (fallback used)' }}

            🤖 Generated automatically by GitHub Actions
          branch: "blog-post-${{ env.RELEASE_TAG }}"
          base: main
          delete-branch: true