name: Auto-generate Blog Post for New Radius Release

on:
  repository_dispatch:
    types: [radius-release-published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (optional - will use latest if not provided)'
        required: false
        type: string
  push:
    branches:
      - 'autogen'

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate blog post and create PR
        run: |
          # Determine release tag from event
          RELEASE_TAG=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RELEASE_TAG="${{ github.event.client_payload.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          fi

          # Generate AI content
          if ./scripts/generate-ai-content.sh "$RELEASE_TAG" "${{ secrets.GITHUB_TOKEN }}"; then
            AI_SUCCESS="true"
          else
            AI_SUCCESS="false"
          fi

          # Create blog post
          ./scripts/create-blog-post.sh "$RELEASE_TAG" "ai_content.md"

          # Create pull request
          ./scripts/create-pr.sh "$RELEASE_TAG" "${{ secrets.GH_RAD_CI_BOT_PAT }}" "$AI_SUCCESS"