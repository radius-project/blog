name: Auto-generate Blog Post for New Radius Release

on:
  repository_dispatch:
    types: [radius-release-published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (optional - will use latest if not provided)'
        required: false
        type: string
  push:
    branches:
      - 'autogen'

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate blog post and create PR
        run: |
          # Get release information using existing script
          INPUT_TAG="${{ github.event.client_payload.tag_name || github.event.inputs.tag_name || '' }}"
          RELEASE_INFO=$(./scripts/get-release-info.sh "$INPUT_TAG")

          # Extract tag from release info
          RELEASE_TAG=$(echo "$RELEASE_INFO" | grep "TAG_NAME=" | cut -d'=' -f2)

          echo "Using release tag: $RELEASE_TAG"

          # Generate AI content
          if ./scripts/generate-ai-content.sh "$RELEASE_TAG" "${{ secrets.GITHUB_TOKEN }}"; then
            AI_SUCCESS="true"
          else
            AI_SUCCESS="false"
          fi

          # Create blog post
          ./scripts/create-blog-post.sh "$RELEASE_TAG" "ai_content.md"

          # Create pull request
          ./scripts/create-pr.sh "$RELEASE_TAG" "${{ secrets.GH_RAD_CI_BOT_PAT }}" "$AI_SUCCESS"